[package]
name = "pulse-voice"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Headless voice sidecar for Pulse Code (Parakeet transcription, audio capture, hotkey, text insertion). Derived from Meetily."
publish = false

# Standalone crate: not a member of the Meetily root workspace.
[workspace]

[dependencies]
anyhow = "1"
base64 = "0.22"
cpal = "0.15.3"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
log = "0.4"
ndarray = "0.16"
num_cpus = "1"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "ndarray", "download-binaries"] }
regex = "1"
rubato = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
silero = { git = "https://github.com/emotechlab/silero-rs", rev = "26a6460", default-features = false, features = ["static-model"] }
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
